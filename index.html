<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172033"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Quiz Paper</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;padding-bottom:85px}header{position:sticky;top:0;z-index:5;background:#172033;color:white;padding:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}main{max-width:900px;margin:auto;padding:10px}.card{background:white;border-radius:15px;padding:14px;margin:9px 0;box-shadow:0 1px 4px #0001}button,select,input{font:inherit}button{border:0;border-radius:9px;padding:10px 12px;font-weight:800}.blue{background:#2563eb;color:white}.green{background:#16a34a;color:white}.red{background:#dc2626;color:white}.gray{background:#e5e7eb}.small{font-size:12px;color:#64748b}.qrow{border-bottom:1px solid #e5e7eb;padding:13px 2px}.qtext{font-size:16px;line-height:1.65;margin-bottom:8px}.num{font-weight:900;color:#2563eb;margin-right:5px}.ans{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.judge{margin-top:6px;font-size:14px;padding:7px;border-radius:8px}.ok{background:#ecfdf5}.ng{background:#fef2f2}.warn{background:#fffbeb}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px}.score{font-weight:900}.hidden{display:none}</style></head>
<body><header><div class="row between"><b>Quiz Paper</b><span id=topscore>未採点</span></div></header><main>
<div class=card><b>問題集</b><div class=row style="margin-top:8px"><input id=file type=file accept=".csv,.txt,.tsv"><button class=blue id=load>読み込んで保存</button></div><div class=row style="margin-top:8px"><select id=decks></select><button class=gray id=open>開く</button><button class=red id=del>削除</button></div><div class=small>Front / Back / Tags形式。問題集は端末内に保存されます。</div></div>
<div class=card><div class="row between"><b id=title>問題一覧</b><span class=score id=score></span></div><div class=small>好きな順番で解答できます。採点するまで正解は表示しません。</div><div id=list></div></div></main>
<div class=bottom><button class=blue id=grade>全問採点</button><button class=gray id=clear>解答をクリア</button><button class=gray id=retry>誤答だけ表示</button><button class=gray id=all>全問表示</button></div>
<script>
"use strict";const E=x=>document.getElementById(x);let decks=JSON.parse(localStorage.getItem("quizpaper_decks")||"{}"),data=[],name="",results={},wrongOnly=false;
function hira(s){return s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))}
function norm(s){return hira(String(s??"").normalize("NFKC").toLowerCase()).replace(/[「」『』【】（）()［］\[\]・･,.，。、\s"'’‘“”]/g,"").replace(/ー/g,"")}
function variants(a){let x=String(a??"");let vs=[x];x.split(/[／/;；]/).forEach(v=>vs.push(v));let noParen=x.replace(/[（(][^）)]*[）)]/g,"");vs.push(noParen);let par=[...x.matchAll(/[（(]([^）)]+)[）)]/g)].map(m=>m[1]);vs.push(...par);return [...new Set(vs.map(norm).filter(Boolean))]}
function lev(a,b){let m=a.length,n=b.length,d=Array(n+1).fill(0).map((_,j)=>j);for(let i=1;i<=m;i++){let p=d;d=[i,...Array(n)];for(let j=1;j<=n;j++)d[j]=Math.min(d[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1))}return d[n]}
function judge(u,a){let x=norm(u);if(!x)return {ok:false,blank:true};let vs=variants(a);if(vs.includes(x))return {ok:true,why:"表記ゆれを許容して一致"};for(let y of vs){let L=Math.max(x.length,y.length),dist=lev(x,y);if(L>=5&&dist<=1)return {ok:true,why:"軽微な表記ゆれとして正解"};if(L>=9&&dist<=2)return {ok:true,why:"軽微な表記ゆれとして正解"};if(L>=6&&(x.includes(y)||y.includes(x))&&Math.min(x.length,y.length)/L>=.72)return {ok:true,why:"主要部分が一致"}}return {ok:false,blank:false}}
function parse(t){let R=[],r=[],c="",z=false;for(let i=0;i<t.length;i++){let x=t[i];if(x=='"'){if(z&&t[i+1]=='"'){c+='"';i++}else z=!z}else if(x==','&&!z){r.push(c);c=""}else if((x=="\n"||x=="\r")&&!z){if(x=="\r"&&t[i+1]=="\n")i++;r.push(c);if(r.some(v=>v.trim()))R.push(r);r=[];c=""}else c+=x}r.push(c);if(r.some(v=>v.trim()))R.push(r);return R}
function refresh(){E("decks").innerHTML="";Object.keys(decks).forEach(n=>{let o=document.createElement("option");o.value=n;o.textContent=n+" ("+decks[n].length+"問)";E("decks").appendChild(o)})}
async function load(){let f=E("file").files[0];if(!f)return alert("CSVを選択");let R=parse(await f.text()),h=R.shift(),fi=h.indexOf("Front"),bi=h.indexOf("Back"),ti=h.indexOf("Tags");if(fi<0||bi<0)return alert("Front / Back列が必要です");let a=R.map(r=>({q:r[fi]||"",a:r[bi]||"",tags:ti>=0?r[ti]||"":""})).filter(x=>x.q&&x.a);name=f.name.replace(/\.[^.]+$/,"");decks[name]=a;localStorage.setItem("quizpaper_decks",JSON.stringify(decks));refresh();E("decks").value=name;openDeck();alert(a.length+"問を保存しました")}
function openDeck(){name=E("decks").value;if(!decks[name])return;data=decks[name];results={};wrongOnly=false;E("title").textContent=name;render()}
function render(){let L=E("list");L.innerHTML="";data.forEach((x,i)=>{if(wrongOnly&&results[i]!==false)return;let d=document.createElement("div");d.className="qrow";d.innerHTML=`<div class=qtext><span class=num>${i+1}.</span>${esc(x.q)}</div><input class=ans data-i="${i}" placeholder="解答" value="${esc(localStorage.getItem(key(i))||"")}"><div class="judge hidden" id="j${i}"></div>`;L.appendChild(d)});document.querySelectorAll(".ans").forEach(inp=>inp.oninput=()=>localStorage.setItem(key(+inp.dataset.i),inp.value));update()}
function key(i){return "qp_ans_"+name+"_"+i}function grade(){results={};data.forEach((x,i)=>{let u=localStorage.getItem(key(i))||"",j=judge(u,x.a);results[i]=j.ok;let el=E("j"+i);if(!el)return;el.className="judge "+(j.ok?"ok":j.blank?"warn":"ng");el.innerHTML=j.ok?`<b>○</b> ${esc(j.why)}`:j.blank?`未解答　正解：<b>${esc(x.a)}</b>`:`<b>×</b>　正解：<b>${esc(x.a)}</b>　<button onclick="manual(${i},true)">○に訂正</button>`});update();window.scrollTo({top:0,behavior:"smooth"})}
window.manual=(i,v)=>{results[i]=v;let e=E("j"+i);if(e){e.className="judge ok";e.innerHTML="<b>○ 手動で正解に訂正</b>"}update()}
function update(){let vals=Object.values(results);if(!vals.length){E("score").textContent="";E("topscore").textContent="未採点";return}let ok=vals.filter(Boolean).length;E("score").textContent=`${ok} / ${data.length}点`;E("topscore").textContent=`${ok} / ${data.length}`}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
E("load").onclick=load;E("open").onclick=openDeck;E("grade").onclick=grade;E("retry").onclick=()=>{if(!Object.keys(results).length)return alert("先に採点してください");wrongOnly=true;render();grade()};E("all").onclick=()=>{wrongOnly=false;render();if(Object.keys(results).length)grade()};E("clear").onclick=()=>{if(confirm("この問題集の解答をすべて消しますか？")){data.forEach((_,i)=>localStorage.removeItem(key(i)));results={};wrongOnly=false;render()}};
E("del").onclick=()=>{let n=E("decks").value;if(decks[n]&&confirm(n+"を削除？")){delete decks[n];localStorage.setItem("quizpaper_decks",JSON.stringify(decks));refresh();data=[];E("list").innerHTML=""}};
refresh();if(Object.keys(decks).length){E("decks").value=Object.keys(decks)[0];openDeck()}if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
</script></body></html>
